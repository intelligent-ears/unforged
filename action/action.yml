name: Unforged independent builder
description: Rebuild a recipe with the unforged CLI, then sign and publish an attestation to Arkiv (Rabdi testnet).

# Expects a checkout of the unforged repo as the working directory.
# Every build, attest and publish step is the CLI command a person runs locally.
#
# Composite actions can't read `secrets`, so the keys arrive as inputs. They reach only the attest
# and publish steps, through `env`. Setting them as `env` on the caller's step would expose them
# to every step here, including pnpm install.

inputs:
  recipe:
    description: Path to the recipe YAML
    required: true
  expected-root:
    description: Fail before attesting unless the build prints this manifest root
    required: false
    default: ""
  mirror-ref:
    description: Mirror folder to check and record. Needs gateway
    required: false
    default: ""
  gateway:
    description: Mirror base URL, ending in "/". Needs mirror-ref
    required: false
    default: ""
  builder-private-key:
    description: The builder's signing key (BUILDER_PRIVATE_KEY)
    required: true
  arkiv-access-key:
    description: Rabdi RPC access key (ARKIV_ACCESS_KEY). Without it, publish refuses and the attestation is left in the artifacts
    required: false
    default: ""

outputs:
  manifest-root:
    description: The manifest root the build printed
    value: ${{ steps.build.outputs.manifest-root }}
  entity-key:
    description: The Arkiv entity holding this builder's attestation
    value: ${{ steps.publish.outputs.entity-key }}
  mirror-ref:
    description: The mirror ref held by the entity. Empty if none was given or an existing entity keeps a different one
    value: ${{ steps.publish.outputs.mirror-ref }}

runs:
  using: composite
  steps:
    - name: Require the builder key
      if: inputs.builder-private-key == ''
      shell: bash
      run: |
        echo "::error::BUILDER_PRIVATE_KEY is not set, so this run could not sign an attestation"
        exit 1

    - name: Warn about a missing access key
      if: inputs.arkiv-access-key == ''
      shell: bash
      run: echo "::warning::ARKIV_ACCESS_KEY is not set. The build and attestation will run, but publish will refuse"

    - name: Read the recipe
      id: recipe
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        MIRROR_REF: ${{ inputs.mirror-ref }}
        GATEWAY: ${{ inputs.gateway }}
      run: |
        # A lone mirror setting must stop here: entities are readonly, so an attestation
        # published without its ref could never gain one.
        if { [ -n "$MIRROR_REF" ] && [ -z "$GATEWAY" ]; } || { [ -z "$MIRROR_REF" ] && [ -n "$GATEWAY" ]; }; then
          echo "::error::mirror-ref and gateway must be given together"
          exit 1
        fi

        node_version=$(yq -r '.node' "$RECIPE")
        build_path=$(yq -r '.buildPath' "$RECIPE")
        if ! [[ "$node_version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
          echo "::error::recipe.node is not a version: $node_version"
          exit 1
        fi
        # At least two levels deep, because the parent gets chowned to the runner user.
        if ! [[ "$build_path" =~ ^(/[^/]+){2,}$ ]] || [[ "/$build_path/" == */../* ]]; then
          echo "::error::recipe.buildPath needs an absolute parent directory below /: $build_path"
          exit 1
        fi

        {
          echo "node=$node_version"
          echo "build-parent=$(dirname "$build_path")"
          echo "build-output=$build_path/$(yq -r '.output' "$RECIPE")"
        } >> "$GITHUB_OUTPUT"

    - name: Set up the recipe's Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.recipe.outputs.node }}
        package-manager-cache: false

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Install the CLI's dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build the CLI
      shell: bash
      run: pnpm -r build

    - name: Prepare the build path
      shell: bash
      env:
        BUILD_PARENT: ${{ steps.recipe.outputs.build-parent }}
      run: |
        sudo mkdir -p "$BUILD_PARENT"
        sudo chown "$(id -un):$(id -gn)" "$BUILD_PARENT"

    - name: unforged build
      id: build
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
      run: |
        # The dapp's install and build output goes to build.log.
        root=$(node apps/cli/dist/cli.js build "$RECIPE")
        echo "manifest root: $root"
        echo "manifest-root=$root" >> "$GITHUB_OUTPUT"

    # Runs before the comparison fails the job. Only on a mismatch, so a good run uploads nothing extra.
    - name: Upload main.*.js for diffing a root mismatch
      if: inputs.expected-root != '' && steps.build.outputs.manifest-root != inputs.expected-root
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unforged-mismatch-main-js
        path: ${{ steps.recipe.outputs.build-output }}/**/main.*.js
        if-no-files-found: warn
        overwrite: true

    - name: Compare with the expected root
      if: inputs.expected-root != ''
      shell: bash
      env:
        ROOT: ${{ steps.build.outputs.manifest-root }}
        EXPECTED_ROOT: ${{ inputs.expected-root }}
      run: |
        if [ "$ROOT" != "$EXPECTED_ROOT" ]; then
          echo "::error::manifest root $ROOT does not match expected root $EXPECTED_ROOT. Nothing was attested"
          exit 1
        fi
        echo "manifest root matches the expected root"

    - name: unforged attest
      id: attest
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        BUILDER_PRIVATE_KEY: ${{ inputs.builder-private-key }}
      run: |
        output=$(node apps/cli/dist/cli.js attest manifest.json "$RECIPE")
        printf '%s\n' "$output"
        builder=$(printf '%s\n' "$output" | sed -n 's/^builder: *//p')
        echo "builder=$builder" >> "$GITHUB_OUTPUT"

    - name: unforged publish
      id: publish
      shell: bash
      env:
        MIRROR_REF: ${{ inputs.mirror-ref }}
        GATEWAY: ${{ inputs.gateway }}
        BUILDER_PRIVATE_KEY: ${{ inputs.builder-private-key }}
        ARKIV_ACCESS_KEY: ${{ inputs.arkiv-access-key }}
      run: |
        mirror_args=()
        if [ -n "$MIRROR_REF" ] && [ -n "$GATEWAY" ]; then
          mirror_args=(--mirror-ref "$MIRROR_REF" --gateway "$GATEWAY")
        fi

        # stderr is kept apart because it carries the warning about a ref that wasn't recorded.
        errors="$RUNNER_TEMP/publish.err"
        status=0
        output=$(node apps/cli/dist/cli.js publish attestation.json manifest.json "${mirror_args[@]}" 2> "$errors") || status=$?
        cat "$errors" >&2
        printf '%s\n' "$output"
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi

        recorded_ref="$MIRROR_REF"
        if grep -q 'was NOT recorded' "$errors"; then
          recorded_ref=""
          echo "::warning::This builder already published this root, and that readonly entity keeps its own mirror ref"
        fi

        {
          echo "result=$(printf '%s\n' "$output" | head -n 1)"
          echo "entity-key=$(printf '%s\n' "$output" | sed -n 's/^entity key: *//p')"
          echo "tx-url=$(printf '%s\n' "$output" | sed -n 's/^tx: *//p')"
          echo "builder-url=$(printf '%s\n' "$output" | sed -n 's/^builder: *//p')"
          echo "mirror-ref=$recorded_ref"
        } >> "$GITHUB_OUTPUT"

    - name: Write the job summary
      if: always()
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        ROOT: ${{ steps.build.outputs.manifest-root }}
        EXPECTED_ROOT: ${{ inputs.expected-root }}
        BUILDER: ${{ steps.attest.outputs.builder }}
        RESULT: ${{ steps.publish.outputs.result }}
        ENTITY_KEY: ${{ steps.publish.outputs.entity-key }}
        TX_URL: ${{ steps.publish.outputs.tx-url }}
        BUILDER_URL: ${{ steps.publish.outputs.builder-url }}
        MIRROR_REF: ${{ steps.publish.outputs.mirror-ref }}
      run: |
        if [ -z "$EXPECTED_ROOT" ]; then
          match="not checked"
        elif [ "$ROOT" = "$EXPECTED_ROOT" ]; then
          match="yes"
        else
          match="**no**"
        fi

        {
          echo "## Unforged build"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Recipe | \`$RECIPE\` |"
          echo "| Manifest root | \`${ROOT:-none, the build did not finish}\` |"
          echo "| Expected root | \`${EXPECTED_ROOT:-not set}\` |"
          echo "| Roots match | $match |"
          echo "| Builder | \`${BUILDER:-not attested}\` |"
          echo "| Arkiv | ${RESULT:-not published} |"
          echo "| Entity key | \`${ENTITY_KEY:-none}\` |"
          echo "| Mirror ref | \`${MIRROR_REF:-none}\` |"
          if [ -n "$TX_URL" ]; then
            echo "| Transaction | [Arkiv explorer]($TX_URL) |"
          fi
          if [ -n "$BUILDER_URL" ]; then
            echo "| Builder address | [Arkiv explorer]($BUILDER_URL) |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the build's records
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unforged-build
        # Listed by name, so nothing else in the working directory can be swept in.
        path: |
          manifest.json
          build-info.json
          attestation.json
          build.log
        if-no-files-found: warn
        overwrite: true
